<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Spieltag-Radar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%2322c55e'/%3E%3Ccircle cx='50' cy='50' r='18' fill='%230f1115'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#2a2f3a;
  --text:#e8eaef; --muted:#9aa1ad; --accent:#22c55e; --live:#ef4444; --bvb:#facc15; --lfc:#e11d48;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:18px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:22px;margin:0;letter-spacing:.2px}
h1 span{color:var(--accent)}
.spoiler{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--text)}
.spoiler .dot{width:10px;height:10px;border-radius:50%;background:#555}
.spoiler.on .dot{background:var(--accent)}
nav{display:flex;gap:4px;margin-top:10px}
nav button{flex:1 1 auto;background:none;border:none;color:var(--muted);padding:10px 2px;font-size:16px;white-space:nowrap;border-bottom:2px solid transparent}
nav button.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 30px);max-width:720px;margin:0 auto}
.daybar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.daybar button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;width:44px;height:38px;font-size:22px}
.daybar .label{text-align:center}
.daybar .label b{display:block;font-size:19px}
.daybar .label small{color:var(--muted)}
.comp{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.comp h2{font-size:16px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0;padding:10px 12px;background:var(--card2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.match{padding:10px 12px;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:none}
.match.fav{box-shadow:inset 3px 0 0 var(--accent)}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center}
.time{font-size:16px;color:var(--muted);text-align:center;line-height:1.2}
.time.live{color:var(--live);font-weight:700}
.time.live::before{content:"";display:block;width:7px;height:7px;border-radius:50%;background:var(--live);margin:0 auto 3px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.teams div{display:flex;align-items:center;gap:8px;min-height:24px}
.teams img{width:20px;height:20px;object-fit:contain;flex:none}
.teams .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teams .win{font-weight:700}
.score{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-variant-numeric:tabular-nums;font-weight:700;font-size:19px;min-width:28px}
.score.hidden{cursor:pointer}
.reveal{background:var(--card2);border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:6px 8px;font-size:14px}
.vids{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 62px}
.vid{display:inline-flex;align-items:center;gap:6px;background:#26313a;color:#e8eaef;text-decoration:none;border-radius:999px;padding:6px 11px;font-size:16px;border:1px solid #33424e}
.vid.main{background:var(--accent);color:#06210f;border-color:var(--accent);font-weight:700}
.vid small{opacity:.8}
.novid{font-size:14px;color:var(--muted)}
.novid a{color:var(--muted)}
.sub{font-size:14px;color:var(--muted);margin:6px 0 0 62px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.teamcard h2{color:var(--text);font-size:18px;text-transform:none;letter-spacing:0}
.teamcard h3{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0;padding:10px 12px 0}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:500;font-size:14px}
td.t,th.t{text-align:left}
td.t{display:flex;align-items:center;gap:7px}
td.t img{width:18px;height:18px}
tr.fav td{background:rgba(34,197,94,.08)}
.tbl{font-size:16px}.tbl th,.tbl td{padding:7px 3px}.tbl td.t{max-width:120px}.tbl td.t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg.small button{padding:6px 10px;font-size:14px}
.lead{display:grid;grid-template-columns:26px 22px 1fr auto auto;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:17px}
.lead:last-child{border-bottom:none}.lead .r{color:var(--muted);text-align:right}.lead small{display:block;color:var(--muted);font-size:14px}
.lead .sp{color:var(--muted);font-size:14px}.lead .v{font-weight:800;font-size:19px;min-width:22px;text-align:right}
.lead.fav{background:rgba(34,197,94,.08)}
.lead img{width:22px;height:22px;object-fit:contain}
td.r{color:var(--muted);width:28px}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.seg button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 12px;font-size:16px}
.seg button.active{color:#06210f;background:var(--accent);border-color:var(--accent);font-weight:600}
.status{font-size:14px;color:var(--muted);text-align:center;margin-top:16px}
.err{background:#3a1d1d;border:1px solid #5b2a2a;color:#fecaca;border-radius:10px;padding:10px;margin-bottom:12px;font-size:16px}
.load{color:var(--muted);text-align:center;padding:24px}
.crow{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:none;border-bottom:1px solid var(--line);color:var(--text);padding:14px 12px;font-size:18px;text-align:left;font-family:inherit}
.crow:last-child{border-bottom:none}.crow .chev{color:var(--muted);font-size:22px}
.ctop{display:flex;align-items:center;gap:12px;margin:0 0 12px}.ctop b{font-size:20px}
.daybar button:disabled{opacity:.3}
footer{color:var(--muted);font-size:13px;text-align:center;padding:8px 14px 24px}
.match{cursor:pointer}
.match .more{float:right;color:var(--muted);font-size:14px}
#detail{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
#detail.open{display:block}
#teamview{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
#teamview.open{display:block}
.thead{display:flex;align-items:center;gap:12px;padding:12px 0}.thead img{width:44px;height:44px;object-fit:contain}.thead b{font-size:22px}
.tlogo{display:inline-flex;padding:8px;margin:-8px;cursor:pointer}
[data-team]{cursor:pointer}
.teamhint{font-size:14px;color:var(--muted);text-align:center;margin:-4px 0 12px}
body.noscroll{overflow:hidden}
.dhead{position:sticky;top:0;z-index:2;background:rgba(15,17,21,.97);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 0}
.dtop{display:flex;align-items:center;gap:10px}
.back{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 12px;font-size:17px}
.dcomp{color:var(--muted);font-size:14px}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 0 10px;text-align:center}
.board img{width:44px;height:44px;object-fit:contain}
.board .tn{font-size:17px;font-weight:600;margin-top:4px}
.board .big{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;min-width:90px}
.board .st{font-size:14px;color:var(--muted)}
.board .st.live{color:var(--live);font-weight:700}
.dtabs{display:flex;gap:2px}
.dtabs button{flex:1;background:none;border:none;color:var(--muted);padding:10px 2px;font-size:16px;border-bottom:2px solid transparent}
.dtabs button.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.dbody{padding:12px;max-width:720px;margin:0 auto}
.ev{display:grid;grid-template-columns:44px 22px 1fr;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:start;font-size:17px}
.ev:last-child{border-bottom:none}
.ev .m{color:var(--muted);font-variant-numeric:tabular-nums}
.ev.away{background:rgba(255,255,255,.02)}
.ev small{display:block;color:var(--muted)}
.stat{padding:9px 12px;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:none}
.stat .lbl{display:flex;justify-content:space-between;font-size:17px;font-variant-numeric:tabular-nums}
.stat .lbl span:nth-child(2){color:var(--muted);font-size:14px}
.bars{display:flex;gap:4px;margin-top:5px;height:6px}
.bars i{display:block;height:6px;border-radius:3px}
.bars .h{background:var(--accent);margin-left:auto}
.bars .a{background:#60a5fa}
.bars>div{flex:1;display:flex;background:var(--card2);border-radius:3px}
.lineup h4{margin:0;padding:10px 12px;font-size:16px;color:var(--muted);background:var(--card2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.pl{display:grid;grid-template-columns:30px 1fr auto;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:17px}
.pl .nr{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.pl .pos{color:var(--muted);font-size:14px}
.pl .ic{font-size:14px;color:var(--muted);white-space:nowrap}
.tick{padding:9px 12px;border-bottom:1px solid var(--line);font-size:17px;display:grid;grid-template-columns:46px 1fr;gap:8px}
.tick .m{color:var(--muted);font-variant-numeric:tabular-nums}
.tick.key{background:rgba(34,197,94,.07)}
.note{font-size:14px;color:var(--muted);padding:0 2px 10px}
.pitch{position:relative;height:460px;margin:0;background:repeating-linear-gradient(0deg,#1f6f3a 0 46px,#22783f 46px 92px);overflow:hidden}
.pline{position:absolute;border:2px solid rgba(255,255,255,.35)}
.pline.mid{left:0;right:0;top:50%;height:0;border-width:2px 0 0}
.pline.circle{left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%}
.pline.box{left:22%;right:22%;height:60px}
.pline.box.top{top:-2px;border-top:0}
.pline.box.bot{bottom:-2px;border-bottom:0}
.pp{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:84px;text-align:center}
.pn{width:30px;height:30px;border-radius:50%;background:#f8fafc;color:#0f1115;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.pnm{margin-top:3px;font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.pic{font-size:12px;line-height:1}
/* ================= Design "Metro dunkel" (Windows-Phone-Stil, gewaehlt am 06.11.2026) ================= */
:root{--bg:#000000;--card:#000000;--card2:#1c1c1c;--line:#262626;--text:#ffffff;--muted:#8c8c8c;--accent:#1ba1e2;--live:#1ba1e2}
html,body{font-family:"Segoe UI","Segoe WP",Inter,-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
.comp,.comp>*,.vid,.seg button,.daybar button,.back,.reveal,.err,.spoiler,.tile,.crest,.bars>div,.bars i{border-radius:0!important}
header{position:relative;background:var(--bg);border:0;padding:calc(env(safe-area-inset-top) + 16px) 0 0}
.top{padding:0 18px}
h1{font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
h1 span{color:inherit}
.spoiler{border:0;padding:0;font-size:14px;color:var(--accent);background:none}
.spoiler .dot{display:none}
nav{gap:0;margin-top:0;overflow-x:auto;scrollbar-width:none;padding-left:14px}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;font-size:44px;font-weight:300;letter-spacing:-1.5px;color:#4a4a4a;padding:0 18px 4px 0;border:0;line-height:1.15}
nav button.active{color:var(--text);font-weight:300;border:0}
main{padding:2px 16px calc(env(safe-area-inset-bottom) + 30px)}
.comp{background:none;border:0;overflow:visible;margin-bottom:12px}
.comp>h2{background:none;border:0;padding:10px 0 2px;font-size:24px;font-weight:300;letter-spacing:-.3px;color:var(--accent);text-transform:none}
.comp>h2 span:last-child{font-size:15px;color:var(--muted);align-self:center}
.comp>.match{padding:8px 0;border:0}
.match.fav{box-shadow:none}
.time{font-size:15px;font-weight:400}
.time.live{color:var(--accent)}.time.live::before{background:var(--accent)}
.teams div{font-size:18px}
.teams img{width:22px;height:22px}
.score{font-weight:300;font-size:22px}
.vids,.sub{margin-left:62px}
.vid{background:var(--card2);color:var(--text);border:0;font-size:14px;padding:7px 12px}
.vid.main{background:var(--accent);color:#fff;font-weight:500}
.reveal{background:none;border:2px solid var(--text);color:var(--text);font-size:14px}
.daybar button,.back{background:none;border:2px solid var(--text);color:var(--text)}
.seg{gap:18px;margin:0 0 10px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{background:none;border:0;padding:4px 0;color:#5a5a5a;font-size:24px;font-weight:300;letter-spacing:-.4px}
.seg button.active{background:none;color:var(--text);font-weight:300}
.seg.small{gap:16px}.seg.small button{font-size:17px;padding:2px 0;font-weight:400}
.seg.small button.active{color:var(--accent);font-weight:400}
.err{background:#3a1212;border:0;color:#ffb4b4}
tr.fav td,.lead.fav,.tick.key{background:rgba(27,161,226,.13)}
th,td,.lead,.stat,.pl,.tick,.ev,.crow{border-color:var(--line)}
.ev.away{background:rgba(255,255,255,.03)}
.lineup h4{background:none;font-size:20px;font-weight:300;color:var(--accent);border:0;padding:12px 0 4px}
.crow{font-size:22px;font-weight:300;padding:12px 0;border:0;color:var(--text)}
.ctop b{font-size:28px;font-weight:300}
#detail,#teamview{background:var(--bg)}
.dhead{background:var(--bg);border:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 0}
.dtabs{overflow-x:auto;scrollbar-width:none;gap:0}
.dtabs button{flex:none;font-size:26px;font-weight:300;color:#4a4a4a;padding:4px 16px 6px 0;border:0}
.dtabs button.active{color:var(--text);font-weight:300;border:0}
.board .big{font-weight:300}
.thead b{font-size:30px;font-weight:300}
.bars .h{background:var(--accent)}.bars .a{background:#8c8c8c}
/* Startseite im Kachel-Stil */
.tile{position:relative;padding:14px;margin-bottom:10px}
.tile .th{display:flex;align-items:center;gap:12px;margin-bottom:12px;cursor:pointer}
.tile .th b{font-size:26px;font-weight:300;letter-spacing:-.5px;line-height:1.1}
.crest{width:40px;height:40px;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.crest img{width:32px;height:32px;object-fit:contain}
.crest.s{width:24px;height:24px}.crest.s img{width:19px;height:19px}
.tile .lbl{font-size:13px;letter-spacing:.3px;opacity:.75;margin:10px 0 4px;font-weight:600}
.trow{display:grid;grid-template-columns:72px 24px 1fr auto;column-gap:10px;align-items:center;padding:8px 10px;margin-bottom:3px;background:rgba(0,0,0,.16);cursor:pointer}
.trow .when{font-size:14px;line-height:1.2}.trow .when small{display:block;font-size:12px;opacity:.75}
.trow .op{font-size:16px;line-height:1.25;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .op small{opacity:.75;font-size:13px}
.trow .res{font-size:19px;font-weight:300;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.trow .vids{grid-column:2/5;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:5px}
.trow .vid{background:rgba(0,0,0,.3);color:inherit;font-size:13px;padding:4px 8px;font-weight:500}
.trow .vid small{opacity:1}
.trow .vid.main{background:rgba(0,0,0,.5)}
.trow .vid.yt{background:rgba(0,0,0,.2);font-weight:400;opacity:.85}
.trow .novid,.trow .novid a{color:inherit;opacity:.75;font-size:12px}
.trow .reveal{border-color:currentColor;color:inherit;padding:2px 8px;font-size:13px}
.trow:empty{display:none}
.tile.match,.trow.match{border-bottom:0}
.tile.today{background:var(--accent);color:#fff;cursor:pointer}
.tile.today .big{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.tile.today .big .tn{font-size:16px;margin-top:6px}
.tile.today .sc2{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums}
.tile.today .meta{font-size:13px;opacity:.9;margin-bottom:8px}
.tile.today .vids{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.tile.today .vid{background:rgba(0,0,0,.28);color:#fff}
.rb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;font-size:16px;font-weight:700;color:#fff;border:1.5px solid rgba(255,255,255,.9)}
.rb.w{background:#15803d}.rb.d{background:#6b7280}.rb.l{background:#b91c1c}
.trow.past{grid-template-columns:72px 1fr auto}
.trow.past .vids{grid-column:2/4}
.pair{min-width:0}
.pl2{display:grid;grid-template-columns:24px 1fr auto;gap:9px;align-items:center;padding:2px 0}
.pl2 span{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.8}
.pl2 b{font-size:19px;font-weight:300;font-variant-numeric:tabular-nums;min-width:16px;text-align:right;opacity:.8}
.pl2.win span,.pl2.win b{font-weight:700;opacity:1}
/* Hauptmenue als Kacheln */
header{padding-bottom:6px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 16px 0;margin:0;overflow:visible}
nav button{font-size:14px;font-weight:500;letter-spacing:0;line-height:1.15;color:#fff;padding:0 7px 7px;height:64px;display:flex;align-items:flex-end;text-align:left;opacity:.45;white-space:normal;overflow:hidden;hyphens:manual}
nav button[data-view="teams"]{background:#1ba1e2}nav button[data-view="games"]{background:#8cbf26}
nav button[data-view="tables"]{background:#e51400}nav button[data-view="comps"]{background:#f09609}
nav button.active{opacity:1;color:#fff;font-weight:600}
/* Auswahlleisten als Kacheln */
.seg{gap:6px;margin:4px 0 8px}
.seg button{flex:none;background:#1c1c1c;color:#bdbdbd;font-size:15px;font-weight:400;letter-spacing:0;padding:16px 12px 8px;min-width:96px;text-align:left}
.seg button.active{background:var(--accent);color:#fff;font-weight:500}
.seg.small{gap:6px}.seg.small button{font-size:14px;padding:10px 12px;min-width:0}
.seg.small button.active{background:#fff;color:#000;font-weight:500}
/* Spiele als Kacheln */
.comp>.match{background:#1c1c1c;padding:12px;margin-bottom:6px}
.comp>.match.fav{box-shadow:inset 4px 0 0 var(--accent)}
.vids,.sub{margin-left:62px}
/* Wettbewerbe als Kacheln */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctile{border:0;color:#fff;text-align:left;font-family:inherit;font-size:18px;font-weight:400;padding:52px 12px 10px;cursor:pointer;line-height:1.2}
/* Tabellen groesser */
.tbl{font-size:18px}.tbl th{font-size:15px}.tbl th,.tbl td{padding:9px 3px}.tbl td.t{max-width:118px}.tbl td.t img{width:22px;height:22px}
.lead{font-size:18px}.lead small{font-size:15px}.lead .v{font-size:21px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="home" role="button" style="cursor:pointer">Spieltag-<span>Radar</span></h1>

(() => {
  const DT = ["stats", "lineups", "events", "ticker"];
  let sx = 0, sy = 0, st = 0, ok = false, horiz = null, el = null;
  const scrollsX = n0 => { for (let n = n0; n && n !== document.body; n = n.parentElement) { if (n.scrollWidth > n.clientWidth + 4 && /(auto|scroll)/.test(getComputedStyle(n).overflowX)) return true; } return false; };
  const target = () => {
    const d = $("#detail"), t = $("#teamview");
    if (d.classList.contains("open") && +d.style.zIndex >= +(t.style.zIndex || 0)) return d.querySelector(".dbody");
    if (t.classList.contains("open")) return t;
    return $("#app");
  };
  const reset = () => { if (!el) return; el.style.transition = "transform .25s cubic-bezier(.1,.9,.2,1), opacity .2s"; el.style.transform = ""; el.style.opacity = ""; };
  document.addEventListener("touchstart", e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); horiz = null; el = null;
    ok = e.touches.length === 1 && sx > 18 && sx < window.innerWidth - 18 && !scrollsX(e.target);
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!ok) return;
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (horiz === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) { horiz = Math.abs(dx) > Math.abs(dy) * 1.3; if (horiz) { el = target(); el.style.transition = "none"; } }
    if (horiz && el) { el.style.transform = `translateX(${dx * 0.55}px)`; el.style.opacity = String(Math.max(.35, 1 - Math.abs(dx) / 500)); }
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (!ok || !horiz) return;
    const t = e.changedTouches[0], dx = t.clientX - sx;
    if (Date.now() - st > 900 || Math.abs(dx) < 50) { reset(); return; }
    const dir = dx < 0 ? 1 : -1;
    if ($("#detail").classList.contains("open") && el === $("#detail .dbody")) {
      const n = DT.indexOf(detail.tab) + dir;
      if (n >= 0 && n < DT.length) { detail.tab = DT[n]; renderDetail(); $("#detail").scrollTop = 0; slideIn(el, dir); } else reset();
      return;
    }
    if ($("#teamview").classList.contains("open") && el === $("#teamview")) {
      if (dir < 0) { el.style.transition = "transform .2s ease-in, opacity .2s"; el.style.transform = "translateX(100%)"; el.style.opacity = "0"; setTimeout(() => { closeTeam(false); el.style.transition = "none"; el.style.transform = ""; el.style.opacity = ""; }, 200); } else reset();

/* ================= Spiel-Darstellung ================= */
function statusInfo(ev) {
  const st = (ev.competitions?.[0]?.status || ev.status || {});
  const t = st.type || {};
  const state_ = t.state;
  let label = "";
  if (state_ === "pre") {
    if (/postpon/i.test(t.name || "")) label = "Verlegt";
    else if (/cancel/i.test(t.name || "")) label = "Abgesagt";
    else label = berlin(ev.date, { hour: "2-digit", minute: "2-digit" });
  } else if (state_ === "in") {
    label = /HALF/i.test(t.name || "") && /HALFTIME/i.test(t.name || "") ? "Pause" : (st.displayClock || "live");
  } else {
    const d = t.shortDetail || t.detail || "";
    label = /pen/i.test(d) ? "n.E." : /AET|extra/i.test(d) ? "n.V." : /postpon/i.test(d) ? "Verlegt" : "Ende";
  }
  return { state: state_, label, live: state_ === "in" };
}
function scoreOf(c) { const s = c.score; return s == null ? "" : (typeof s === "object" ? (s.displayValue ?? s.value) : s); }

function matchHTML(ev, slug, opts = {}) {
  const comp = ev.competitions[0];
  const home = comp.competitors.find(c => c.homeAway === "home") || comp.competitors[0];
  const away = comp.competitors.find(c => c.homeAway === "away") || comp.competitors[1];
  const st = statusInfo(ev);
  const fav = MY_IDS.has(home.team.id) || MY_IDS.has(away.team.id);
  const showScore = st.state !== "pre";
  const hide = showScore && state.spoiler && !state.revealed.has(ev.id);
  let scoreCol = "";
  if (showScore) {
    scoreCol = hide
      ? `<button class="reveal" data-reveal="${esc(ev.id)}">Ergebnis</button>`
      : `<div class="score"><span>${esc(scoreOf(home))}</span><span>${esc(scoreOf(away))}</span></div>`;
  }
  const winH = !hide && st.state === "post" && home.winner, winA = !hide && st.state === "post" && away.winner;
  const logo = t => { const u = t.logo || t.logos?.[0]?.href || (t.id ? `https://a.espncdn.com/i/teamlogos/soccer/500/${t.id}.png` : ""); const img = u ? `<img loading="lazy" src="${esc(u)}" alt="" onerror="this.style.visibility='hidden'">` : `<span style="width:20px"></span>`; return t.id ? `<span class="tlogo" data-team="${esc(t.id)}" aria-label="Teamseite">${img}</span>` : img; };
  const dateLine = opts.withDate ? `<div class="sub">${esc(berlin(ev.date, { weekday:"long", day:"2-digit", month:"2-digit" }))} · ${esc((COMP_BY[slug]||{}).name || ev.league?.name || "")}</div>` : "";
  return `<div class="match${fav ? " fav" : ""}${opts.noDetail ? " nodetail" : ""}" data-ev="${esc(ev.id)}" data-slug="${esc(slug)}">
    <div class="row">
      <div class="time${st.live ? " live" : ""}">${esc(st.label)}</div>
      <div class="teams">
        <div>${logo(home.team)}<span class="name${winH ? " win" : ""}">${esc(deName(home.team))}</span></div>
        <div>${logo(away.team)}<span class="name${winA ? " win" : ""}">${esc(deName(away.team))}</span></div>
      </div>
      ${scoreCol}
    </div>
    ${dateLine}
    ${st.state === "post" ? `<div class="vids" data-vids="${esc(ev.id)}"><span class="novid">Suche Zusammenfassung …</span></div>` : ""}
  </div>`;
}

const ytMem = new Map();
async function channelUploads(key) {

  if (ytMem.has(key)) return ytMem.get(key);
  const p = (async () => {
    const items = []; let tok = "";
    for (let pg = 0; pg < (ch.pages || 1); pg++) {
      const url = "https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=UU" + ch.id.slice(2) + "&key=" + YT_KEY + (tok ? "&pageToken=" + tok : "");
      const r = await fetch(url);
      if (!r.ok) { if (items.length) break; throw new Error("YouTube " + r.status); }
      const j = await r.json();
      items.push(...(j.items || []).map(i => ({ id: i.snippet.resourceId.videoId, title: i.snippet.title, at: i.snippet.publishedAt })));
      tok = j.nextPageToken; if (!tok) break;
    }
    store.set(ck, { t: Date.now(), items });
    return items;
  })();

  try { return await p; } finally { setTimeout(() => ytMem.delete(key), 60000); }
}
async function searchFallback(ev, keys, kick) {

  if (hit && (hit.items.length || Date.now() - hit.t < 24 * 3600000)) return hit.items;
  const byId = {}; keys.forEach((k, i) => { if (CH[k] && !(CH[k].id in byId)) byId[CH[k].id] = [k, i]; });
  const q = ev.competitions[0].competitors.map(c => deName(c.team)).join(" ");
  let items = [];
  try {
    const url = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=25&q=" + encodeURIComponent(q) +
      "&publishedAfter=" + new Date(kick + 45 * 60000).toISOString() + "&publishedBefore=" + new Date(kick + 4 * 86400000).toISOString() + "&key=" + YT_KEY;
    const r = await fetch(url); if (!r.ok) return [];
    const j = await r.json();
    items = (j.items || []).filter(i => byId[i.snippet.channelId]).map(i => ({ id: i.id.videoId, title: i.snippet.title.replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"'), at: i.snippet.publishedAt, label: CH[byId[i.snippet.channelId][0]].label, prio: byId[i.snippet.channelId][1] }));

}
async function findVideos(ev, slug) {
  const comp = ev.competitions[0];
  const [a, b] = comp.competitors.map(c => c.team);
  const ka = teamKeys(a), kb = teamKeys(b);
  const kick = new Date(ev.date).getTime();
  const keys = [...(VIDEO_CHANNELS[slug] || [])];
  for (const c of comp.competitors) if (CLUB_CHANNEL[c.team.id]) keys.push(CLUB_CHANNEL[c.team.id]);
  const found = [];
  for (const [prio, key] of keys.entries()) {
    let items;
    try { items = await channelUploads(key); } catch (e) { found.error = true; continue; }
    for (const v of items) {
      const t = norm(v.title), at = new Date(v.at).getTime();
      if (at < kick + 45 * 60000 || at > kick + 4 * 86400000) continue;
      if (NEG.test(t) || !POS.test(t)) continue;
      if (!hasKey(t, ka) || !hasKey(t, kb)) continue;
      const score = prio * 10 + (/highlight|zusammenfassung/.test(t) ? 0 : 3);
      found.push({ ...v, label: CH[key].label, score });
    }
  }
  // Aeltere Spiele der Favoriten: Videos sind oft nicht mehr unter den neuesten Uploads, dann gezielt suchen (nur offizielle Kanaele)
  if (new Set(found.map(v => v.label)).size < 2 && isMine(ev) && Date.now() > kick + 3 * 3600000) {
    for (const v of await searchFallback(ev, keys, kick)) {
      const t = norm(v.title), at = new Date(v.at).getTime();
      if (at > kick + 4 * 86400000) continue;
      if (NEG.test(t) || !POS.test(t) || !hasKey(t, ka) || !hasKey(t, kb)) continue;
      found.push({ ...v, score: v.prio * 10 + (/highlight|zusammenfassung/.test(t) ? 0 : 3) });
    }
  }
  const uniq = []; const ids = new Set();
  for (const v of found) if (!ids.has(v.id)) { ids.add(v.id); uniq.push(v); }
  // Laenge: Wunsch ca. 3 Minuten, bei vielen Toren bis 5 Minuten
  const dur = await videoDurations(uniq.map(v => v.id));

  const max = goals >= 5 ? 300 : 240, target = goals >= 5 ? 240 : 180;
  for (const v of uniq) {
    v.sec = dur[v.id] || 0;
    const d = v.sec || 600;
    v.rank = (d < 100 ? 3000 : d > max ? 1000 + (d - max) : Math.abs(d - target)) + v.score * 5;

  const pick = [], labels = new Set();
  for (const v of uniq) { if (pick.length >= 3) break; if (labels.has(v.label)) continue; labels.add(v.label); pick.push(v); }

}
function parseDur(s) { const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s || ""); return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0; }
async function videoDurations(ids) {
  const cache = store.get("sr_dur", {});
  const missing = ids.filter(id => !(id in cache));
  if (missing.length) {
    try {
      const r = await fetch("https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=" + missing.slice(0, 50).join(",") + "&key=" + YT_KEY);
      if (r.ok) {

        const keys = Object.keys(cache); if (keys.length > 800) keys.slice(0, keys.length - 800).forEach(k => delete cache[k]);

    } catch {}

}

async function viewGames() {

// Spiele der letzten und naechsten zwei Monate laden und nach Spieltagen (zusammenhaengende Tage) gruppieren
async function compRounds(slug) {
  const now = new Date();
  const months = [-2, -1, 0, 1, 2].map(n => { const d = new Date(now.getFullYear(), now.getMonth() + n, 1); return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0"); });
  const res = await Promise.allSettled(months.map((m, i) => getJSON(`${ESPN}${slug}/scoreboard?dates=${m}&limit=500`, i === 2 ? 45000 : 30 * 60000)));
  if (res[2].status !== "fulfilled") throw res[2].reason;
  const evs = new Map();
  res.forEach(r => { if (r.status === "fulfilled") (r.value.events || []).forEach(e => evs.set(e.id, e)); });
  const list = [...evs.values()].sort((a, b) => new Date(a.date) - new Date(b.date));
  const rounds = []; let last = null;
  for (const e of list) {
    const d = ymd(new Date(e.date)), n = Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)) / 86400000;
    if (!rounds.length || n - last > 1) rounds.push([]);
    rounds[rounds.length - 1].push(e); last = n;
  }
  return rounds;
}
function defaultRound(rounds) {
  const today = ymd(new Date()), day = e => ymd(new Date(e.date));
  const i = rounds.findIndex(r => day(r[0]) <= today && day(r[r.length - 1]) >= today);
  if (i >= 0) return i;
  let lastPast = -1;
  rounds.forEach((r, k) => { if (day(r[r.length - 1]) < today) lastPast = k; });
  if (lastPast >= 0 && day(rounds[lastPast][rounds[lastPast].length - 1]) >= ymd(addDays(new Date(), -2))) return lastPast;
  if (lastPast + 1 < rounds.length) return lastPast + 1;
  return Math.max(0, lastPast);
}

  state.compRound = Math.min(Math.max(state.compRound, 0), rounds.length - 1);

  const f = e => berlin(e.date, { weekday: "long", day: "2-digit", month: "2-digit" });

const TSDB = "https://www.thesportsdb.com/api/v1/json/123/";
async function tsdbRound(c, season, r) {
  const k = `sr_tsdb_${c.tsdb}_${season}_${r}`, hit = store.get(k, null);
  if (hit) return hit;
  let j;
  for (let tries = 0; ; tries++) {
    try { j = await getJSON(`${TSDB}eventsround.php?id=${c.tsdb}&r=${r}&s=${season}`, 5 * 60000); break; }
    catch (e) { if (tries >= 3) throw e; await new Promise(res => setTimeout(res, 4000 * (tries + 1))); }
  }
  const evs = (j.events || []).map(e => ({ id: e.idEvent, ts: e.strTimestamp, st: e.strStatus, pp: e.strPostponed, h: e.strHomeTeam, a: e.strAwayTeam, hi: e.idHomeTeam, ai: e.idAwayTeam, hb: e.strHomeTeamBadge, ab: e.strAwayTeamBadge, hs: e.intHomeScore, as: e.intAwayScore }));
  // Abgeschlossene Spieltage dauerhaft merken (spart Abrufe, die Quelle erlaubt nur wenige pro Minute)
  if (evs.length && evs.every(e => e.hs != null && e.as != null)) store.set(k, evs);
  return evs;
}
function tsdbEv(e) {
  const date = e.ts ? e.ts + "Z" : null;
  const done = e.hs != null && e.as != null;
  const started = date && new Date(date) < Date.now();
  const st = done ? "post" : started && !/postp|canc/i.test(e.st || "") && e.pp !== "yes" ? "in" : "pre";
  const team = (id, n, b) => ({ id: "tsdb" + id, displayName: n, logo: b ? b + "/tiny" : "" });
  const H = +e.hs, A = +e.as;
  return { id: "tsdb" + e.id, date, competitions: [{ status: { displayClock: "läuft", type: { state: st, name: e.pp === "yes" ? "STATUS_POSTPONED" : "", detail: "" } }, competitors: [
    { homeAway: "home", team: team(e.hi, e.h, e.hb), score: done ? String(e.hs) : null, winner: done && H > A },
    { homeAway: "away", team: team(e.ai, e.a, e.ab), score: done ? String(e.as) : null, winner: done && A > H }
  ] }] };
}
async function tsdbContext(c) {
  const [nx, pv] = await Promise.all([getJSON(`${TSDB}eventsnextleague.php?id=${c.tsdb}`, 30 * 60000).catch(() => ({})), getJSON(`${TSDB}eventspastleague.php?id=${c.tsdb}`, 30 * 60000).catch(() => ({}))]);
  const next = (nx.events || [])[0], past = (pv.events || [])[0];
  return { next, past, season: (next || past)?.strSeason, lastRound: past ? +past.intRound : 0 };
}
// Mehrere Spieltage laden: nacheinander mit kurzer Pause, der kostenlose Zugang erlaubt nur etwa 30 Abrufe pro Minute
async function tsdbRounds(c, season, from, to) {
  const rounds = [];
  for (let r = Math.max(1, from); r <= Math.min(to, c.rounds); r++) {
    const cached = store.get(`sr_tsdb_${c.tsdb}_${season}_${r}`, null);
    rounds.push(cached || await tsdbRound(c, season, r));
    if (!cached) await new Promise(res => setTimeout(res, 600));
  }
  return rounds;
}
async function tsdbPage(slug) {
  const c = COMP_BY[slug];
  const sub = state.compSub === "table" ? "table" : "games";
  let html = `<div class="ctop"><button class="back" data-compback="1">‹ Wettbewerbe</button><b>${esc(c.name)}</b></div>`;

  const { next, past, season, lastRound } = await tsdbContext(c);
  if (!season) return html + `<div class="empty">Daten für die NB I sind gerade nicht erreichbar.</div>`;
  if (sub === "table") {
    if (state.spoiler && !state.tablesRevealed) return html + `<div class="empty">Die Tabelle verrät Ergebnisse.<br><br><button class="reveal" data-showtable="1">Trotzdem anzeigen</button></div>`;
    const rounds = await tsdbRounds(c, season, 1, lastRound + 1);
    const tab = new Map();
    const row = (id, n, b) => { if (!tab.has(id)) tab.set(id, { id, n, b, sp: 0, s: 0, u: 0, nl: 0, gf: 0, ga: 0 }); return tab.get(id); };
    rounds.flat().forEach(e => {

      if (e.hs == null || e.as == null) return;
      const H = +e.hs, A = +e.as;
      h.sp++; a.sp++; h.gf += H; h.ga += A; a.gf += A; a.ga += H;
      if (H > A) { h.s++; a.nl++; } else if (H < A) { a.s++; h.nl++; } else { h.u++; a.u++; }
    });
    const list = [...tab.values()].map(t => ({ ...t, p: t.s * 3 + t.u, d: t.gf - t.ga })).sort((x, y) => y.p - x.p || y.d - x.d || y.gf - x.gf || x.n.localeCompare(y.n));

      ${list.map((t, i) => `<tr data-team="tsdb${esc(t.id)}"><td class="r">${i + 1}</td><td class="t">${t.b ? `<img loading="lazy" src="${esc(t.b)}/tiny" alt="">` : ""}<span>${esc(t.n)}</span></td><td>${t.sp}</td><td>${t.s}</td><td>${t.u}</td><td>${t.nl}</td><td>${t.gf}:${t.ga}</td><td>${t.d > 0 ? "+" + t.d : t.d}</td><td><b>${t.p}</b></td></tr>`).join("")}
      </tbody></table></section><p class="note">Selbst berechnet aus allen Ergebnissen (3 Punkte pro Sieg, bei Gleichstand Tordifferenz, dann Tore). Die offizielle Tabelle kann bei Punktgleichheit anders sortiert sein. Quelle: TheSportsDB.</p>`;
  }
  if (state.compRound == null || state.compRoundFor !== slug) {
    const pastRecent = past && past.strTimestamp && Date.now() - new Date(past.strTimestamp + "Z") < 2 * 86400000;
    state.compRound = pastRecent || !next ? lastRound : +next.intRound; state.compRoundFor = slug;
  }
  state.compRound = Math.min(Math.max(state.compRound, 1), c.rounds);
  const evs = (await tsdbRound(c, season, state.compRound)).map(tsdbEv).sort((a, b) => new Date(a.date) - new Date(b.date));
  html += `<div class="daybar"><button data-round="-1" aria-label="Vorige Runde"${state.compRound === 1 ? " disabled" : ""}>‹</button>
    <div class="label"><b>${state.compRound}. Spieltag</b><small>${evs.length ? esc(berlin(evs[0].date, { day: "2-digit", month: "2-digit" }) + (evs.length > 1 ? " bis " + berlin(evs[evs.length - 1].date, { day: "2-digit", month: "2-digit" }) : "")) : ""}</small></div>
    <button data-round="1" aria-label="Nächster Spieltag"${state.compRound === c.rounds ? " disabled" : ""}>›</button></div>`;
  if (!evs.length) return html + `<div class="empty">Für diesen Spieltag sind noch keine Spiele eingetragen.</div>`;
  const byDay = new Map();
  evs.forEach(e => { evIndex.set(e.id, e); const k = ymd(new Date(e.date)); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(e); });
  for (const list of byDay.values()) html += `<section class="comp"><h2><span>${esc(berlin(list[0].date, { weekday: "long", day: "2-digit", month: "2-digit" }))}</span><span>${list.length}</span></h2>${list.map(e => matchHTML(e, slug, { noDetail: true })).join("")}</section>`;
  return html + `<p class="note">Quelle: TheSportsDB. Ergebnisse erscheinen erst nach Spielende, Spieldetails gibt es für diese Liga nicht. Videos vom ungarischen Verband (MLSZ).</p>`;
}

function posLat(a) {
  a = a || "";
  if (/^(LB|LM|LF|LW|LWB)$/.test(a)) return -2;
  if (/^(RB|RM|RF|RW|RWB|RCF)$/.test(a)) return 2;
  if (/-L$/.test(a)) return -1;
  if (/-R$/.test(a)) return 1;
  return 0;
}
function pitchHTML(r) {
  const st = (r.roster || []).filter(p => p.starter);
  const gk = st.filter(p => p.position?.abbreviation === "G");
  const field = st.filter(p => p.position?.abbreviation !== "G").sort((a, b) => posDepth(a.position?.abbreviation) - posDepth(b.position?.abbreviation) || (a.formationPlace || 99) - (b.formationPlace || 99));
  let counts = String(r.formation || "").split("-").map(n => parseInt(n, 10)).filter(n => n > 0);
  if (counts.reduce((s, n) => s + n, 0) !== field.length) counts = [];
  if (!counts.length || gk.length !== 1) return "";
  const rows = [gk]; let i = 0;
  for (const n of counts) { rows.push(field.slice(i, i + n)); i += n; }
  const name = p => { const a = p.athlete || {}; return a.lastName || (a.displayName || "").split(" ").slice(-1)[0] || a.shortName || ""; };
  const icons = p => {
    const s = p.stats || [], ic = [];
    const g = +(s.find(x => x.name === "totalGoals")?.value || 0); if (g) ic.push("⚽".repeat(Math.min(g, 3)));
    if (+(s.find(x => x.name === "redCards")?.value || 0)) ic.push("🟥"); else if (+(s.find(x => x.name === "yellowCards")?.value || 0)) ic.push("🟨");
    if (p.subbedOut) ic.push("⬇︎");
    return ic.join("");
  };
  const n = rows.length;
  const dots = rows.map((row, ri) => {
    const sorted = row.slice().sort((a, b) => posLat(a.position?.abbreviation) - posLat(b.position?.abbreviation));
    const y = 92 - ri * (84 / (n - 1));
    return sorted.map((p, pi) => {
      const x = (pi + 1) * 100 / (sorted.length + 1);
      return `<div class="pp" style="left:${x}%;top:${y}%"><span class="pn">${esc(p.jersey || "")}</span><span class="pnm">${esc(name(p))}</span>${icons(p) ? `<span class="pic">${icons(p)}</span>` : ""}</div>`;
    }).join("");
  }).join("");
  return `<div class="pitch"><div class="pline mid"></div><div class="pline box top"></div><div class="pline box bot"></div><div class="pline circle"></div>${dots}</div>`;
}
function lineupHTML(r) {
  if (!r?.roster?.length) return "";
  const starters = r.roster.filter(p => p.starter).sort((a, b) => (a.formationPlace || 99) - (b.formationPlace || 99));
  const bench = r.roster.filter(p => !p.starter);
  const row = p => {
    const ic = [];
    if (p.subbedOut) ic.push("⬇︎");
    if (p.subbedIn) ic.push("⬆︎");
    const st = p.stats || [];
    const g = +(st.find(s => s.name === "totalGoals")?.value || 0);
    if (g) ic.push("⚽".repeat(Math.min(g, 4)));
    if (+(st.find(s => s.name === "yellowCards")?.value || 0)) ic.push("🟨");
    if (+(st.find(s => s.name === "redCards")?.value || 0)) ic.push("🟥");
    const pos = p.position?.abbreviation;
    return `<div class="pl"><span class="nr">${esc(p.jersey || "")}</span><span>${esc(p.athlete?.displayName || "")} <span class="pos">${esc(POS_DE[pos] ?? pos ?? "")}</span></span><span class="ic">${ic.join(" ")}</span></div>`;
  };
  const pitch = pitchHTML(r);
  return `<section class="comp lineup"><h4><span>${esc(deName(r.team))}</span><span>${esc(r.formation || "")}</span></h4>
    ${pitch || starters.map(row).join("")}
    ${bench.length ? `<h4><span>Bank</span><span></span></h4>${bench.map(row).join("")}` : ""}</section>`;
}
function detailBody(s, ev) {
  const comp = s.header?.competitions?.[0] || ev?.competitions?.[0] || {};
  const st = statusInfo({ ...ev, competitions: [comp], date: comp.date || ev?.date });
  if (detail.tab === "events") {
    if (st.state === "pre") {
      const gi = s.gameInfo?.venue?.fullName;
      return `<div class="empty">Anstoß ${esc(berlin(comp.date || ev.date, { weekday:"long", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }))} Uhr${gi ? `<br>${esc(gi)}` : ""}<br><br>Aufstellungen erscheinen meist etwa 1 Stunde vor Anpfiff.</div>`;
    }
    const homeId = comp.competitors?.find(c => c.homeAway === "home")?.team?.id;
    const keys = (s.keyEvents || []).filter(k => evIcon(k));
    if (!keys.length) return `<div class="empty">Noch keine Ereignisse.</div>`;
    return `<section class="comp">${keys.map(k => `<div class="ev${k.team?.id && k.team.id !== homeId ? " away" : ""}"><span class="m">${esc(k.clock?.displayValue || "")}</span><span>${evIcon(k)}</span><span>${evText(k)}<small>${esc(deName(k.team || {}) || "")}</small></span></div>`).join("")}</section>`;
  }
  if (detail.tab === "stats") {
    const teams = s.boxscore?.teams || [];
    const home = teams.find(t => t.homeAway === "home") || teams[0], away = teams.find(t => t.homeAway === "away") || teams[1];
    if (!home?.statistics?.length) return `<div class="empty">Noch keine Statistik verfügbar.</div>`;
    const val = (t, n) => t.statistics.find(x => x.name === n);
    const rows = STAT_ROWS.map(([n, label, unit]) => {
      const a = val(home, n), b = val(away, n); if (!a || !b) return "";
      let x = parseFloat(a.displayValue) || 0, y = parseFloat(b.displayValue) || 0;
      let fa = a.displayValue, fb = b.displayValue;
      if (unit === "pct") { fa = Math.round(x * 100) + " %"; fb = Math.round(y * 100) + " %"; }
      if (unit === "%") { fa = Math.round(x) + " %"; fb = Math.round(y) + " %"; }
      const sum = x + y || 1;
      return `<div class="stat"><div class="lbl"><b>${esc(fa)}</b><span>${esc(label)}</span><b>${esc(fb)}</b></div>
        <div class="bars"><div><i class="h" style="width:${(x / sum) * 100}%"></i></div><div><i class="a" style="width:${(y / sum) * 100}%"></i></div></div></div>`;
    }).join("");
    return `<section class="comp">${rows}</section>`;
  }
  if (detail.tab === "lineups") {
    const rs = s.rosters || [];
    if (!rs.some(r => r.roster?.length)) return `<div class="empty">Aufstellungen noch nicht veröffentlicht.<br>Meist etwa 1 Stunde vor Anpfiff.</div>`;
    const h = rs.find(r => r.homeAway === "home") || rs[0], a = rs.find(r => r.homeAway === "away") || rs[1];
    return lineupHTML(h) + lineupHTML(a);
  }
  if (detail.tab === "ticker") {
    const c = (s.commentary || []).slice().reverse();
    if (!c.length) return `<div class="empty">Noch kein Ticker verfügbar.</div>`;
    return `<p class="note">Live-Ticker von ESPN, nur auf Englisch verfügbar. Neueste Meldung oben.</p><section class="comp">${c.map(x => `<div class="tick${/goal!|red card|penalty/i.test(x.text || "") ? " key" : ""}"><span class="m">${esc(x.time?.displayValue || "")}</span><span>${esc(x.text || "")}</span></div>`).join("")}</section>`;
  }
  return "";
}
async function renderDetail(force) {
  const box = $("#detail");

  let s;
  try {
    const live = ev && statusInfo(ev).state === "in";
    s = await getJSON(`${ESPN}${detail.slug}/summary?event=${detail.id}`, force ? 0 : (live ? 20000 : 5 * 60000));
  } catch (e) {
    box.querySelector(".dbody").innerHTML = `<div class="err">Spieldaten konnten nicht geladen werden (${esc(e.message)}).</div>`;
    return;
  }
  if (!box.classList.contains("open") || !s) return;
  detail.data = s;
  const comp = s.header?.competitions?.[0] || ev?.competitions?.[0];
  const evLike = { ...(ev || {}), id: detail.id, competitions: [comp], date: comp?.date || ev?.date };
  const st = statusInfo(evLike);
  const home = comp.competitors.find(c => c.homeAway === "home"), away = comp.competitors.find(c => c.homeAway === "away");
  const hide = st.state !== "pre" && state.spoiler && !state.revealed.has(detail.id);
  const tlogo = t => { const u = t.logo || t.logos?.[0]?.href || `https://a.espncdn.com/i/teamlogos/soccer/500/${t.id}.png`; return `<img src="${esc(u)}" alt="" onerror="this.style.visibility='hidden'">`; };
  box.querySelector(".board").innerHTML = `
    <div data-team="${esc(home.team.id)}">${tlogo(home.team)}<div class="tn">${esc(deName(home.team))}</div></div>
    <div><div class="big">${st.state === "pre" ? "-:-" : hide ? `<button class="reveal" data-reveal="${esc(detail.id)}">Ergebnis zeigen</button>` : `${esc(scoreOf(home))}:${esc(scoreOf(away))}`}</div>
      <div class="st${st.live ? " live" : ""}">${esc(st.state === "pre" ? berlin(evLike.date, { weekday:"long", day:"2-digit", month:"2-digit" }) + ", " + st.label + " Uhr" : st.label)}</div></div>
    <div data-team="${esc(away.team.id)}">${tlogo(away.team)}<div class="tn">${esc(deName(away.team))}</div></div>`;

function openDetail(id, slug) {

  box.innerHTML = `<div class="dhead"><div class="dtop"><button class="back" data-close="1">‹ Zurück</button><span class="dcomp">${esc(c ? c.name : "")}</span></div>
    <div class="board"></div>
    <div class="dtabs"><button data-dtab="stats">Statistik</button><button data-dtab="lineups">Aufstellung</button><button data-dtab="events">Ereignisse</button><button data-dtab="ticker">Ticker</button></div></div>
    <div class="dbody"><div class="load">Lade Spieldaten …</div></div>`;

function closeDetail(fromHistory) {

// Zurueck-Taste schliesst immer die oberste Ansicht (Spiel oder Team)
let ignorePop = 0;
window.addEventListener("popstate", () => {
  if (ignorePop > 0) { ignorePop--; return; }
  const d = $("#detail"), t = $("#teamview");

/* ================= Teamseite: letzte und naechste Spiele ================= */
let zTop = 20;
const team = { id: null };
function openTeam(id) {
  if (!id) return;
  team.id = id;
  const box = $("#teamview");
  box.innerHTML = `<div class="dhead"><div class="dtop"><button class="back" data-closeteam="1">‹ Zurück</button><span class="dcomp">Team</span></div><div class="thead"></div></div><div class="dbody"><div class="load">Lade Spiele …</div></div>`;
  box.classList.add("open"); document.body.classList.add("noscroll"); box.scrollTop = 0; box.style.zIndex = ++zTop;
  try { history.pushState({ team: id }, ""); } catch {}
  renderTeam();
}
async function renderTeam() {
  const box = $("#teamview"), id = team.id;
  if (!id || !box.classList.contains("open")) return;
  if (String(id).startsWith("tsdb")) return renderTsdbTeam(box, id);
  const [res, fix] = await Promise.allSettled([
    getJSON(`${ESPN}all/teams/${id}/schedule`, 5 * 60000),
    getJSON(`${ESPN}all/teams/${id}/schedule?fixture=true`, 30 * 60000)
  ]);
  if (team.id !== id) return;
  const ok = x => x.status === "fulfilled" ? (x.value.events || []) : [];
  const info = (res.status === "fulfilled" ? res.value.team : null) || (fix.status === "fulfilled" ? fix.value.team : null) || { id };
  const lg = info.logo || info.logos?.[0]?.href || `https://a.espncdn.com/i/teamlogos/soccer/500/${id}.png`;
  box.querySelector(".thead").innerHTML = `<img src="${esc(lg)}" alt="" onerror="this.style.visibility='hidden'"><b>${esc(info.displayName ? deName(info) : "Team")}</b>`;
  const past = ok(res).filter(e => e.league?.slug !== "club.friendly" && statusInfo(e).state === "post").sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
  const next = ok(fix).filter(e => statusInfo(e).state !== "post").sort((a, b) => new Date(a.date) - new Date(b.date)).slice(0, 3);
  [...past, ...next].forEach(e => evIndex.set(e.id, e));
  const y = box.scrollTop;
  box.querySelector(".dbody").innerHTML = (res.status !== "fulfilled" ? `<div class="err">Ergebnisse konnten nicht geladen werden.</div>` : "") +
    `<section class="comp"><h2><span>Letzte Spiele</span><span></span></h2>${past.map(e => matchHTML(e, e.league?.slug, { withDate: true })).join("") || `<div class="empty">Keine Spiele gefunden.</div>`}</section>` +
    `<section class="comp"><h2><span>Nächste Spiele</span><span></span></h2>${next.map(e => matchHTML(e, e.league?.slug, { withDate: true })).join("") || `<div class="empty">Keine Termine.</div>`}</section>`;
  box.scrollTop = y;
  fillVideos(box);
}
// Teamseite fuer NB-I-Vereine aus den Spieltagsdaten von TheSportsDB
async function renderTsdbTeam(box, id) {
  const c = COMP_BY["hun.1"], tid = String(id).slice(4);
  const { season, lastRound } = await tsdbContext(c);
  if (!season) { box.querySelector(".dbody").innerHTML = `<div class="err">Daten für die NB I sind gerade nicht erreichbar.</div>`; return; }
  const all = (await tsdbRounds(c, season, 1, lastRound + 4)).flat().filter(e => e.hi === tid || e.ai === tid);
  if (team.id !== id) return;
  const any = all[0];
  if (any) {
    const home = any.hi === tid, b = home ? any.hb : any.ab;
    box.querySelector(".thead").innerHTML = `${b ? `<img src="${esc(b)}/tiny" alt="">` : ""}<b>${esc(home ? any.h : any.a)}</b>`;
  }
  const evs = all.map(tsdbEv);
  const past = evs.filter(e => statusInfo(e).state === "post").sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
  const next = evs.filter(e => statusInfo(e).state !== "post").sort((a, b) => new Date(a.date) - new Date(b.date)).slice(0, 3);
  [...past, ...next].forEach(e => evIndex.set(e.id, e));
  box.querySelector(".dbody").innerHTML =
    `<section class="comp"><h2><span>Letzte Spiele</span><span></span></h2>${past.map(e => matchHTML(e, "hun.1", { withDate: true, noDetail: true })).join("") || `<div class="empty">Keine Spiele gefunden.</div>`}</section>` +
    `<section class="comp"><h2><span>Nächste Spiele</span><span></span></h2>${next.map(e => matchHTML(e, "hun.1", { withDate: true, noDetail: true })).join("") || `<div class="empty">Keine Termine.</div>`}</section>` +
    `<p class="note">Nur Spiele der NB I. Quelle: TheSportsDB, Videos vom ungarischen Verband (MLSZ).</p>`;
  fillVideos(box);
}
function closeTeam(fromHistory) {
  const box = $("#teamview");
  if (!box.classList.contains("open")) return;
  box.classList.remove("open"); team.id = null;
  if (!$("#detail").classList.contains("open")) document.body.classList.remove("noscroll");
  if (!fromHistory) { ignorePop++; try { history.back(); } catch { ignorePop--; } }

$("#detail").addEventListener("click", e => {
  if (e.target.closest("[data-close]")) { closeDetail(false); return; }
  const t = e.target.closest("[data-dtab]");
  if (t) { detail.tab = t.dataset.dtab; renderDetail(); $("#detail").scrollTop = 0; return; }
  const r = e.target.closest("[data-reveal]");
  if (r) { e.stopPropagation(); state.revealed.add(r.dataset.reveal); renderDetail(); }
});

/* ================= Rendern & Aktualisieren ================= */
let renderToken = 0, lastUpdate = null;
async function render(showLoading) {
  paintNav();
  const token = ++renderToken;
  const app = $("#app");
  if (showLoading) app.innerHTML = `<div class="load">Lade Daten …</div>`;
  state.hasLive = false;
  let html;
  try {
    html = state.view === "games" ? await viewGames() : state.view === "tables" ? await viewTables() : state.view === "comps" ? await viewComps() : await viewTeams();
    lastUpdate = new Date();
  } catch (e) {
    html = `<div class="err">Daten konnten nicht geladen werden (${esc(e.message)}). Ich versuche es gleich erneut.</div>`;
  }
  if (token !== renderToken) return;
  const y = window.scrollY;
  app.innerHTML = html + `<div class="status">${lastUpdate ? "Stand: " + esc(berlin(lastUpdate, { hour:"2-digit", minute:"2-digit", second:"2-digit" })) : ""}${state.hasLive ? " · aktualisiert sich jede Minute" : ""}</div>`;
  if (!showLoading) window.scrollTo(0, y);
  fillVideos(app);
  schedule();
}
let timer = null;
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(() => { if (!document.hidden) render(); else schedule(); }, state.hasLive ? 60000 : 5 * 60000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

paintSpoiler();
render(true);
